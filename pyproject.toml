[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cyp_challenge"
version = "0.0.1"
description = "The challenge by OPENADMET for prediction of CPY inhibition."
authors = [
  { name = "Yash Dhanawate" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["cyp_challenge"]
include = ["pyproject.toml", "cyp_challenge/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["cyp_challenge"]
force-sort-within-sections = true

